version: '3.8'

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ecomshopping-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=YourStrong@Passw0rd
      - MSSQL_PID=Express
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    networks:
      - ecomshopping-network

  api:
    build:
      context: .
      dockerfile: src/EcomShopping.API/Dockerfile
    container_name: ecomshopping-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=EcomShoppingDb;User Id=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=True;MultipleActiveResultSets=true
    ports:
      - "5000:80"
      - "5001:443"
    depends_on:
      - sqlserver
    networks:
      - ecomshopping-network

  web:
    build:
      context: .
      dockerfile: src/EcomShopping.Web/Dockerfile
    container_name: ecomshopping-web
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
      - ApiBaseUrl=http://api
    ports:
      - "5002:80"
      - "5003:443"
    depends_on:
      - api
    networks:
      - ecomshopping-network

volumes:
  sqlserver-data:

networks:
  ecomshopping-network:
    driver: bridge
