name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '8.0.x'
    
    - name: Restore dependencies
      run: dotnet restore
    
    - name: Build
      run: dotnet build --no-restore --configuration Release
    
    - name: Test
      run: dotnet test --no-build --configuration Release --verbosity normal
    
    - name: Publish API
      run: dotnet publish src/EcomShopping.API/EcomShopping.API.csproj --configuration Release --output ./publish/api
    
    - name: Publish Web
      run: dotnet publish src/EcomShopping.Web/EcomShopping.Web.csproj --configuration Release --output ./publish/web
    
    - name: Upload API artifacts
      uses: actions/upload-artifact@v3
      with:
        name: api-artifacts
        path: ./publish/api
    
    - name: Upload Web artifacts
      uses: actions/upload-artifact@v3
      with:
        name: web-artifacts
        path: ./publish/web

  docker:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Build Docker images
      run: |
        docker-compose build
    
    - name: Log in to Docker Hub (if configured)
      if: ${{ secrets.DOCKER_USERNAME && secrets.DOCKER_PASSWORD }}
      run: echo ${{ secrets.DOCKER_PASSWORD }} | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin
    
    - name: Push Docker images (if configured)
      if: ${{ secrets.DOCKER_USERNAME && secrets.DOCKER_PASSWORD }}
      run: |
        docker-compose push
